[package]
name = "kadrell-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "=0.26.0"
async-channel = "2.5"
gpui-pre = "=0.3.13"
gpui-pre-platform = "=0.3.13"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Ohne `font-kit` nimmt GPUI auf dem Mac das NoopTextSystem: kein einziger Text.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-platform = { version = "=0.3.13", features = ["font-kit"] }
