name: Kadrell
options:
  bundleIdPrefix: de.malura
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "Apple Development: Michael Malura (BDU98TP9AX)"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 9XCGGAFET4
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 233c6ba
targets:
  Kadrell:
    type: application
    platform: macOS
    sources:
      - path: Kadrell
    dependencies:
      - package: SwiftTerm
    info:
      path: Kadrell/Info.plist
      properties:
        CFBundleName: Kadrell
        CFBundleDisplayName: Kadrell
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "12"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Michael Malura"
        CFBundleIconFile: Kadrell
        NSMicrophoneUsageDescription: "Claude-Sessions im Terminal nutzen das Mikrofon für die Spracheingabe."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malura.kadrell
        PRODUCT_NAME: Kadrell
  KadrellTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KadrellTests
    dependencies:
      - target: Kadrell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malura.kadrell.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kadrell:
    build:
      targets:
        Kadrell: all
        KadrellTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KadrellTests
