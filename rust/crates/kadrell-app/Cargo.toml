[package]
name = "kadrell-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kadrell-term = { path = "../kadrell-term" }
gpui-pre = "=0.3.13"
gpui-pre-platform = "=0.3.13"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Ohne `font-kit` nimmt GPUI auf dem Mac das NoopTextSystem: kein einziger Text.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-platform = { version = "=0.3.13", features = ["font-kit"] }
