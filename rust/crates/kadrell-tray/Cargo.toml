[package]
name = "kadrell-tray"
description = "Kadrell: Tray-/Menüleisten-Icon, Benachrichtigungen, Badge und Sounds (ohne GUI-Framework)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log = "0.4"
kadrell-i18n = { path = "../kadrell-i18n" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSSound", "NSStatusBar", "NSStatusItem", "NSDockTile", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject", "NSArray", "NSDictionary", "NSError", "NSBundle"] }
objc2-user-notifications = { version = "0.3", features = ["UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNUserNotificationCenter", "block2"] }
