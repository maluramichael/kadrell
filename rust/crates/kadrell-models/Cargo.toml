[package]
name = "kadrell-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kadrell: lokale Modelle (Ollama, llama.cpp), ohne Oberfläche"

[dependencies]
kadrell-claude = { path = "../kadrell-claude" }
kadrell-core = { path = "../kadrell-core" }
kadrell-i18n = { path = "../kadrell-i18n" }
serde_json = "1.0.144"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
kadrell-i18n = { path = "../kadrell-i18n", features = ["pin-german"] }
