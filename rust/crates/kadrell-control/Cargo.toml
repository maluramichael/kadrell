[package]
name = "kadrell-control"
description = "Kadrell: Steuerkanal und Kommandozeile (kadrell <befehl>), Protokoll, Server und Client, Aufrufer per Prozessbaum"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Versionen wie in kadrell-core und rust/Cargo.lock, ohne neue Pakete (Lieferketten-Vorsicht).
[dependencies]
kadrell-core = { path = "../kadrell-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.144" # gpui-pre verlangt ^1.0.144, exakter Pin kollidiert
uuid = { version = "=1.17.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp"] }
