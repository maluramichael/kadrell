[package]
name = "kadrell-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kadrell-term = { path = "../kadrell-term" }
kadrell-core = { path = "../kadrell-core" }
kadrell-claude = { path = "../kadrell-claude" }
kadrell-control = { path = "../kadrell-control" }
kadrell-accounts = { path = "../kadrell-accounts" }
kadrell-ext = { path = "../kadrell-ext" }
kadrell-i18n = { path = "../kadrell-i18n" }
kadrell-models = { path = "../kadrell-models" }
kadrell-tray = { path = "../kadrell-tray" }
gpui-pre = "=0.3.13"
gpui-pre-platform = "=0.3.13"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2.5"
serde_json = "1.0.144" # gpui-pre verlangt ^1.0.144, exakter Pin kollidiert
sysinfo = "0.40" # Prozessliste für laufende Bash-Kommandos (statt `ps`, das es unter Windows nicht gibt)

# Fenster verstecken und zeigen (tray_wire/window.rs): HWND aus GPUI, ShowWindow.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Ohne `font-kit` nimmt GPUI auf dem Mac das NoopTextSystem: kein einziger Text.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-platform = { version = "=0.3.13", features = ["font-kit"] }

[dev-dependencies]
# Tests prüfen deutsche Texte: die gemeinsame Sprache startet auf Deutsch, nicht in der Systemsprache.
kadrell-i18n = { path = "../kadrell-i18n", features = ["pin-german"] }

# SIGTERM/SIGINT/SIGHUP fangen (Version wie in kadrell-control und rust/Cargo.lock).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
