[package]
name = "kadrell"
version = "1.89.0"
edition = "2021"
description = "Kadrell für Windows: alle Claude-Code-Sessions in einem Terminalfenster, steuerbar wie die Mac-App"
license = "MIT"
publish = false

[[bin]]
name = "kadrell"
path = "src/main.rs"

# Versionen bewusst gepinnt auf Stände, die mindestens zwei Wochen alt sind (Lieferketten-Vorsicht).
[dependencies]
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
ratatui = "=0.30.0"
crossterm = "=0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
uuid = { version = "=1.17.0", features = ["v4"] }

[profile.release]
strip = true
