name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # Kadrell targets macOS 15. If the macos-15 image is unavailable on your
    # runner, swap this for `macos-latest`.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      # Build without code signing. Signing is only needed for distribution
      # (Developer ID + notarization), never for CI, so no signing secrets are
      # required here.
      - name: Build (Debug, unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project Kadrell.xcodeproj \
            -scheme Kadrell \
            -configuration Debug \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Tests run unsigned. Some of them drive a running app and expect a
      # `claude` binary; if the runner cannot provide that, this step is
      # informational rather than a gate. Remove `continue-on-error` once the
      # suite runs reliably headless in your environment.
      - name: Test (Debug, unsigned)
        working-directory: app
        continue-on-error: true
        run: |
          xcodebuild \
            -project Kadrell.xcodeproj \
            -scheme Kadrell \
            -configuration Debug \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

  lizard:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lizard
        run: pip install lizard

      # Complexity gate: cyclomatic complexity must stay at 15 or lower.
      # `-w` prints only warnings and exits non-zero if any function exceeds it.
      - name: Complexity check (CCN <= 15)
        working-directory: app
        run: lizard Kadrell -w
