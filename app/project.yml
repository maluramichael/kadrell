name: Kadrell
options:
  bundleIdPrefix: de.malura
  developmentLanguage: de
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Gepinnte Paketversionen (auch transitive) liegen versioniert neben dieser Datei, das xcodeproj ist gitignoriert.
  postGenCommand: mkdir -p Kadrell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Package.resolved Kadrell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "Apple Development: Michael Malura (BDU98TP9AX)"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 9XCGGAFET4
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 233c6ba11aa9b2b9ffbd6b90467b079402f3c264
targets:
  Kadrell:
    type: application
    platform: macOS
    sources:
      - path: Kadrell
      - path: ../CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    info:
      path: Kadrell/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleName: Kadrell
        CFBundleDisplayName: Kadrell
        CFBundleShortVersionString: "1.40.2"
        CFBundleVersion: "69"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Michael Malura"
        CFBundleIconFile: Kadrell
        NSMicrophoneUsageDescription: "Claude-Sessions im Terminal nutzen das Mikrofon für die Spracheingabe."
        NSAppleEventsUsageDescription: "Kadrell schlägt bei ⌘N den Ordner des vordersten Finder-Fensters vor."
        NSUserNotificationsUsageDescription: "Kadrell benachrichtigt dich, wenn eine Session auf dich wartet oder fertig ist."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malura.kadrell
        # Hardened Runtime auch im Debug-Build: ohne sie lädt das Binary fremde dylibs mit den TCC-Rechten der App.
        CODE_SIGN_ENTITLEMENTS: Kadrell/Kadrell.entitlements
        PRODUCT_NAME: Kadrell
  KadrellTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KadrellTests
    dependencies:
      - target: Kadrell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malura.kadrell.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kadrell:
    build:
      targets:
        Kadrell: all
        KadrellTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: de
      targets:
        - KadrellTests
