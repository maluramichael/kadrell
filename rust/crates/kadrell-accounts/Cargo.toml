[package]
name = "kadrell-accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Claude-Konten, Nutzung, Auto-Wechsel und Statistik-Reihen von Kadrell (ohne GUI)"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
kadrell-i18n = { path = "../kadrell-i18n" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.144"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
